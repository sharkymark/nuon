postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: latest
  architecture: "standalone"
  postgresqlDatabase: "outline"
  postgresqlUsername: "outline"
  postgresqlPassword: "vh4rf^q32BcvtFqFVjny4pnM"
  postgresqlPostgresPassword: "Ma#wXFMz6jFqXUr^qP&K66XQbd"
  persistence:
    enabled: true
