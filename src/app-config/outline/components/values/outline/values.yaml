  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: latest
  disableWebUI: false
  ingress:
    enabled: true
    hostname: "{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
