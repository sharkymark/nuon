# https://hub.docker.com/r/outlinewiki/outline/tags

name: outline

image:
  repository: outlinewiki/outline
  tag: "{{.nuon.inputs.inputs.release}}"
  pullPolicy: IfNotPresent

replicas: 1

# Generate secure keys with: openssl rand -hex 32
secretKey: "5974e36f82085f057223565ac2d0d01427a90248ade611108b4b937672649bd4"
utilsSecret: "8c5a14973325ba56694a99856e6be330812b875e5f683dd37022cf76444774bb"

ingress:
  enabled: false
  tls:
    enabled: true
  host: "{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: latest
  architecture: "standalone"
  auth:
    enabled: false
  persistence:
